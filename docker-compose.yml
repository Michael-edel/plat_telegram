services:
  bot:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - bot_data:/app/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - cloudflare
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  bot_data:
