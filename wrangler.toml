name = "plat-telegram-bot"
main = "src/worker.js"
compatibility_date = "2026-06-13"
workers_dev = false

# Replace the pattern with your real Cloudflare domain before the first deploy.
# Example: pattern = "bot.example.com"
routes = [
  { pattern = "bot.example.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "plat_telegram"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
