name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply plat_telegram --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed FTS index
        run: npm run db:seed-fts:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Worker secrets
        shell: bash
        run: |
          printf "%s" "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          printf "%s" "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET
          printf "%s" "$ALLOWED_USERS" | npx wrangler secret put ALLOWED_USERS
          printf "%s" "$APP_BASE_URL" | npx wrangler secret put APP_BASE_URL
          printf "%s" "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf "%s" "$INITIAL_ADMIN_USERNAME" | npx wrangler secret put INITIAL_ADMIN_USERNAME
          printf "%s" "$INITIAL_ADMIN_PASSWORD" | npx wrangler secret put INITIAL_ADMIN_PASSWORD
          printf "%s" "$TASK_DUE_SOON_HOURS" | npx wrangler secret put TASK_DUE_SOON_HOURS
          printf "%s" "$APP_TIMEZONE_OFFSET_HOURS" | npx wrangler secret put APP_TIMEZONE_OFFSET_HOURS
          printf "%s" "$AUDIT_RETENTION_DAYS" | npx wrangler secret put AUDIT_RETENTION_DAYS
          if [ -n "$TELEGRAM_NOTIFY_OVERVIEW_CHAT_ID" ]; then
            printf "%s" "$TELEGRAM_NOTIFY_OVERVIEW_CHAT_ID" | npx wrangler secret put TELEGRAM_NOTIFY_OVERVIEW_CHAT_ID
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'https://bot.michael.kz' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || secrets.WEBHOOK_SECRET }}
          INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME || secrets.PANEL_USERNAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD || secrets.PANEL_PASSWORD }}
          TASK_DUE_SOON_HOURS: ${{ secrets.TASK_DUE_SOON_HOURS || '24' }}
          APP_TIMEZONE_OFFSET_HOURS: ${{ secrets.APP_TIMEZONE_OFFSET_HOURS || '5' }}
          AUDIT_RETENTION_DAYS: ${{ secrets.AUDIT_RETENTION_DAYS || '90' }}
          TELEGRAM_NOTIFY_OVERVIEW_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_OVERVIEW_CHAT_ID }}

      - name: Configure Telegram webhook
        run: node scripts/set-webhook.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
